<!doctype html>
<meta charset="utf-8">
<title>Page edge — light</title>
<style>
  :root { color-scheme: light; background: #fff; color: #252525; font: 16px system-ui; }
  body { margin: 48px; }
  h1 { font-size: 24px; font-weight: 500; }
  p { color: #666; }
  .measure { width: 320px; height: 2px; background: #777; margin-top: 32px; }
</style>
<h1>Light page</h1>
<p id="size"></p>
<div class="measure"></div>
<script>
function measure() { document.querySelector('#size').textContent = `Viewport: ${innerWidth} × ${innerHeight}`; }
addEventListener('resize', measure); measure();
</script>
